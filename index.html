<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>优众代理平台 - 专享注册通道</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f2f5f9;
            color: #333;
            line-height: 1.6;
            padding: 15px;
            /* 防止屏幕被撑宽 */
            overflow-x: hidden; 
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
            text-align: center;
        }
        h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 5px; }
        .subtitle { font-size: 13px; color: #666; margin-bottom: 20px; }
        
        /* 套餐列表样式（替代表格，手机端完美显示） */
        .package-list {
            margin-bottom: 20px;
            text-align: left;
        }
        .package-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .package-info h3 { font-size: 15px; color: #334155; margin-bottom: 2px; }
        .package-info p { font-size: 12px; color: #64748b; }
        .package-price { 
            font-size: 16px; 
            color: #e11d48; 
            font-weight: bold; 
            white-space: nowrap; 
        }

        /* 按钮 */
        .btn-link {
            display: block; 
            width: 100%; 
            padding: 14px 0;
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            text-decoration: none; 
            text-align: center; 
            background-color: #2563eb; 
            color: #ffffff; 
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
            margin-bottom: 15px;
        }
        .btn-link:active { background-color: #1d4ed8; }

        /* 微信号复制区域 */
        .copy-box {
            background-color: #fffbeb;
            border: 2px dashed #fcd34d;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .copy-box p { font-size: 12px; color: #92400e; margin-bottom: 5px; }
        .wechat-text {
            font-size: 20px;
            color: #000;
            font-weight: bold;
            /* 允许长按选中 */
            user-select: all; 
            -webkit-user-select: all;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>优众代理平台</h1>
        <p class="subtitle">国内静态IP · 游戏低延迟专线 · 免费测试</p>

        <!-- 套餐列表 -->
        <div class="package-list">
            <div class="package-item">
                <div class="package-info">
                    <h3>SK5 电信A区</h3>
                    <p>带宽: 5-10M | 适用: 老鱼/模拟器</p>
                </div>
                <div class="package-price">6.00 元/月</div>
            </div>
            
            <div class="package-item">
                <div class="package-info">
                    <h3>SK5 腾讯云</h3>
                    <p>带宽: 5-10M | 适用: 老鱼/模拟器</p>
                </div>
                <div class="package-price">6.00 元/月</div>
            </div>

            <div class="package-item">
                <div class="package-info">
                    <h3>L2TP 电信A区</h3>
                    <p>带宽: 5-10M | 适用: 软路由/群控</p>
                </div>
                <div class="package-price">11.00 元/月</div>
            </div>

            <div class="package-item">
                <div class="package-info">
                    <h3>L2TP 电信B区</h3>
                    <p>带宽: 10-20M | 适用: 软路由/群控</p>
                </div>
                <div class="package-price">15.00 元/月</div>
            </div>
        </div>

        <!-- 跳转按钮（原生A标签，绝不拦截） -->
        <a href="https://sk5ip.cn/views/login.html#?promotionCode=FBAF6A055857A195E1AACA8E294E0760" class="btn-link">
            🚀 点击注册 / 免费测试
        </a>

        <!-- 长按复制区域 -->
        <div class="copy-box">
            <p>👇 长按下方字母复制微信号 👇</p>
            <div class="wechat-text">lzx24ad</div>
        </div>
    </div>

</body>
</html>
