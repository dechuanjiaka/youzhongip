<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优众代理平台 - 专享注册通道</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f2f5f9;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 30px 20px;
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 10px; display: inline-block; }
        h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 8px; font-weight: 600; }
        .subtitle { font-size: 14px; color: #666; margin-bottom: 25px; }
        
        .table-container {
            overflow-x: auto; margin-bottom: 25px;
            border-radius: 8px; border: 1px solid #eaeaea;
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid #eaeaea; }
        th { background-color: #f8fafc; color: #475569; font-weight: 500; }
        td { color: #334155; }
        tr:last-child td { border-bottom: none; }
        .price { color: #e11d48; font-weight: 600; }
        
        /* 原生链接按钮 */
        .btn-link {
            display: block; width: 100%; padding: 14px 0;
            border-radius: 8px; font-size: 16px; font-weight: 500;
            text-decoration: none; cursor: pointer;
            transition: all 0.2s ease; margin-bottom: 12px;
            text-align: center; border: none;
        }
        .btn-primary { 
            background-color: #2563eb; 
            color: #ffffff; 
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); 
        }
        
        /* 复制区域样式 */
        .copy-box {
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            text-align: center;
        }
        .copy-box p {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 5px;
        }
        .wechat-text {
            font-size: 20px;
            color: #0f172a;
            font-weight: bold;
            user-select: all; 
            -webkit-user-select: all; /* 允许一键全选 */
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🌐</div>
        <h1>优众代理平台</h1>
        <p class="subtitle">国内静态IP · 游戏低延迟专线 · 免费测试</p >

        <div class="table-container">
            <table>
                <thead>
                    <tr><th>套餐类型</th><th>带宽</th><th>参考价</th></tr>
                </thead>
                <tbody>
                    <tr><td>SK5 电信A区</td><td>5-10M</td><td class="price">6.00 元/月</td></tr>
                    <tr><td>SK5 腾讯云</td><td>5-10M</td><td class="price">6.00 元/月</td></tr>
                    <tr><td>L2TP 电信A区</td><td>5-10M</td><td class="price">11.00 元/月</td></tr>
                    <tr><td>L2TP 电信B区</td><td>10-20M</td><td class="price">15.00 元/月</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 使用标准的 <a> 标签，绝对不会被拦截 -->
        <a href=" " class="btn-link btn-primary">
            🚀 点击前往注册 / 免费测试
        </a >

        <!-- 放弃 JS，直接展示微信号让用户长按复制 -->
        <div class="copy-box">
            <p>👇 请长按下方字母复制微信号 👇</p >
            <div class="wechat-text">lzx24ad</div>
        </div>

    </div>

</body>
</html>
