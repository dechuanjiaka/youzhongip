<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优众代理平台 - 专享注册通道</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f2f5f9;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 30px 20px;
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 10px; display: inline-block; }
        h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 8px; font-weight: 600; }
        .subtitle { font-size: 14px; color: #666; margin-bottom: 25px; }
        
        /* 特性列表 */
        .features {
            text-align: left;
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }
        .features li {
            list-style: none;
            margin-bottom: 10px;
            font-size: 14px;
            color: #475569;
            display: flex;
            align-items: center;
        }
        .features li:last-child { margin-bottom: 0; }
        .features li::before {
            content: "✅";
            margin-right: 10px;
            font-size: 16px;
        }

        /* 价格表格 */
        .table-container {
            overflow-x: auto;
            margin-bottom: 25px;
            border-radius: 8px;
            border: 1px solid #eaeaea;
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid #eaeaea; }
        th { background-color: #f8fafc; color: #475569; font-weight: 600; }
        td { color: #334155; }
        tr:last-child td { border-bottom: none; }
        .price { color: #e11d48; font-weight: 600; }
        .protocol-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .tag-sk5 { background-color: #dbeafe; color: #1e40af; }
        .tag-l2tp { background-color: #fce7f3; color: #9d174d; }

        /* 按钮通用样式 */
        .btn-link {
            display: block; width: 100%; padding: 15px 0;
            border-radius: 8px; font-size: 16px; font-weight: 600;
            text-decoration: none; cursor: pointer;
            transition: all 0.2s ease; margin-bottom: 15px;
            text-align: center; border: none;
        }
        .btn-primary { 
            background-color: #2563eb; 
            color: #ffffff; 
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); 
        }
        .btn-primary:active { transform: scale(0.98); }

        /* 客服复制区域 */
        .copy-box {
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-top: 5px;
        }
        .copy-box p { font-size: 13px; color: #64748b; margin-bottom: 6px; }
        .wechat-text {
            font-size: 18px;
            color: #0f172a;
            font-weight: bold;
            user-select: all;
            -webkit-user-select: all;
            letter-spacing: 1px;
        }
        .footer-tips { margin-top: 20px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
